[package]
name = "yidu"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-window-state = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
async-trait = "0.1"
rusqlite = { version = "0.37", features = ["bundled"] }
pulldown-cmark = "0.13"
sha2 = "0.10"
regex = "1"
reqwest = { version = "0.12", features = ["stream", "json", "gzip"] }
futures-util = "0.3"
tokio = { version = "1", features = ["sync", "macros", "rt", "time"] }
keyring = { version = "3", features = ["apple-native", "windows-native"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
base64 = "0.22"
png = "0.18" # Windows 截图走剪贴板拿到 RGBA,编码成 PNG 再进 OCR / 多模态模型

[lib]
name = "yidu_lib"
crate-type = ["staticlib", "cdylib", "rlib"]


# v0.3 §2.7:读系统强调色 NSColor.controlAccentColor(tauri 已传递依赖同版本,不新增下载)
# v0.4:Vision 本地 OCR(调研 12;objc2 msg_send 直调,不引 objc2-vision)、剪贴板存取、前台应用、Accessibility 取词与模拟按键
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "NSDictionary", "NSString", "NSError", "NSGeometry", "NSLocale"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSColor", "NSColorSpace", "NSWindow", "NSResponder", "NSPasteboard", "NSPasteboardItem", "NSRunningApplication", "NSWorkspace"] }
core-foundation = "0.10"
core-graphics = "0.25"

# v0.4:WinRT OCR、UI Automation 取词、模拟按键、剪贴板序号
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Foundation", "Foundation_Collections", "Globalization", "Graphics_Imaging", "Media_Ocr", "Security_Cryptography", "Storage_Streams",
  "Win32_Foundation", "Win32_System_Com", "Win32_System_DataExchange", "Win32_UI_Accessibility",
  "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_System_Ole", "Win32_System_Variant",
] }
